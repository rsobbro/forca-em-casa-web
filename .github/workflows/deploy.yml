name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar ficha e estrutura
        run: npm test
  deploy:
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar os arquivos do site
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js plan.js completion-import.js sw.js manifest.webmanifest .nojekyll _site/
          test -s _site/completion-import.js
          cp assets/* _site/assets/
      - name: Enviar artefato estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
