name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar ficha e estrutura
        run: npm test
  deploy:
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar os arquivos do site
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js plan.js completion-import.js exercise-media.js activities.js equipment-audit.js exercise-videos.js measurements.js progress.js assessment-photos.js sw.js manifest.webmanifest .nojekyll _site/
          test -s _site/completion-import.js
          test -s _site/exercise-media.js
          test -s _site/activities.js
          test -s _site/equipment-audit.js
          test -s _site/exercise-videos.js
          test -s _site/measurements.js
          test -s _site/assessment-photos.js
          test -s _site/progress.js
          cp assets/* _site/assets/
      - name: Preparar versão beta isolada para homologação
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin feature/google-drive-sync
          beta_dir="$(mktemp -d)"
          git archive FETCH_HEAD | tar -x -C "$beta_dir"
          mkdir -p _site/beta/assets
          for file in index.html styles.css app.js plan.js completion-import.js exercise-media.js activities.js equipment-audit.js exercise-videos.js measurements.js progress.js assessment-photos.js google-drive-sync.js google-drive-controller.js google-config.js registration.js gate.js nutrition.js wearables.js personal-training.js rest-alert.js sw.js manifest.webmanifest .nojekyll; do
            # .nojekyll é intencionalmente vazio; testar existência, não tamanho.
            test -f "$beta_dir/$file"
            cp "$beta_dir/$file" "_site/beta/$file"
          done
          cp "$beta_dir"/assets/* _site/beta/assets/
          test -s _site/beta/nutrition.js
          test -s _site/beta/wearables.js
          test -s _site/beta/personal-training.js
          test -s _site/beta/rest-alert.js
          grep -Fq 'src="./gate.js"' _site/beta/index.html
          grep -Fq "apps.googleusercontent.com" _site/beta/google-config.js
          # A área /beta/ usa recursos e service worker relativos ao próprio caminho.
          test -s _site/index.html
          test -s _site/beta/index.html
      - name: Enviar artefato estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Aguardar indexação do artefato no GitHub Actions
        run: sleep 12
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
