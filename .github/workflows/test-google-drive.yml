name: Validar integração Google Drive (branch)
on:
  push:
    branches:
      - feature/google-drive-sync
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
